<!DOCTYPE html>
<html>
<head>
<title>QR Code Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input{
padding:10px;
width:80%;
}

button{
background:#0077ff;
color:white;
padding:10px 20px;
border:none;
border-radius:5px;
}

</style>
</head>

<body>

<h2>QR Code Generator</h2>

<div class="box">

<input type="text" id="text" placeholder="Enter text or URL">

<br><br>

<button onclick="generateQR()">Generate QR</button>

<br><br>

<img id="qr">

</div>

<script>

function generateQR(){

let text=document.getElementById("text").value;

document.getElementById("qr").src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+text;

}

</script>

</body>
</html>

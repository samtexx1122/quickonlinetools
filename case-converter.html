<!DOCTYPE html>
<html>
<head>
<title>Text Case Converter</title>
<style>
body{
font-family:Arial;
text-align:center;
padding:30px;
}

textarea{
width:90%;
height:120px;
margin:10px;
padding:10px;
font-size:16px;
}

button{
padding:10px 20px;
margin:5px;
font-size:16px;
}

</style>
</head>

<body>

<h2>Text Case Converter</h2>

<textarea id="text"></textarea>

<br>

<button onclick="upper()">UPPERCASE</button>
<button onclick="lower()">lowercase</button>

<script>

function upper(){
let text=document.getElementById("text").value;
document.getElementById("text").value=text.toUpperCase();
}

function lower(){
let text=document.getElementById("text").value;
document.getElementById("text").value=text.toLowerCase();
}

</script>

</body>
</html>
